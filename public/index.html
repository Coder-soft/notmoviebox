<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>notmoviebox — watch movies &amp; shows</title>
    <meta name="description" content="A standalone MovieBox frontend with the moviethon player." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=8" />
  </head>
  <body>
    <header id="topbar">
      <div class="topbar-inner">
        <button id="menu-btn" class="menu-btn" type="button" aria-label="Open categories" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
          </span>
          <span class="brand-name">notmoviebox</span>
        </a>

        <nav id="nav" class="nav" aria-label="Primary"></nav>

        <form id="search-form" class="search" role="search">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10.5 3a7.5 7.5 0 1 0 4.7 13.35L20 21M10.5 3a7.5 7.5 0 0 1 7.5 7.5"/></svg>
          <input id="search-input" type="search" placeholder="Search movies, shows…" autocomplete="off" />
        </form>

        <button id="account-btn" class="account" type="button">
          <span id="account-label">Sign in</span>
        </button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer id="footer">
      <span>notmoviebox · player adapted from <a href="https://github.com/Coder-soft/moviethon" target="_blank" rel="noreferrer">moviethon</a></span>
      <span class="footer-dim">Unofficial frontend. Data from the public MovieBox API.</span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <div id="drawer-root"></div>

    <script type="module" src="/app.js?v=8"></script>
  </body>
</html>
